services:
  hub-db:
    image: pgvector/pgvector:pg16
    pull_policy: never
    container_name: hub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-hub}
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - type: bind
        source: ${HUB_DB_DATA_DIR:?HUB_DB_DATA_DIR is required}
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hub} -d ${DB_NAME:-hub}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    networks:
      - hub-internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ai:
    image: hub-production-ai:latest
    pull_policy: never
    container_name: hub-ai
    restart: unless-stopped
    environment:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONUTF8: "1"
      PYTHONIOENCODING: UTF-8
      HUB_AI_MODE: ${HUB_AI_MODE:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_TRANSCRIBE_MODEL: ${GEMINI_TRANSCRIBE_MODEL:-gemini-3.5-transcribe}
      HUB_EMBED_MODE: ${HUB_EMBED_MODE:-e5}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    networks:
      - hub-internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: hub-production-backend:latest
    pull_policy: never
    container_name: hub-backend
    restart: unless-stopped
    depends_on:
      hub-db:
        condition: service_healthy
      ai:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgresql,prod
      HUB_BIND_ADDRESS: 0.0.0.0
      HUB_PORT: 8080
      DB_URL: jdbc:postgresql://hub-db:5432/${DB_NAME:-hub}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      HUB_AI_BASE_URL: http://ai:8000
      HUB_STORAGE_ROOT: /app/data/storage
      HUB_JWT_SECRET: ${HUB_JWT_SECRET:?HUB_JWT_SECRET is required}
      HUB_COOKIE_SECURE: ${HUB_COOKIE_SECURE:-true}
      HUB_ENFORCE_SECURE_CONFIG: ${HUB_ENFORCE_SECURE_CONFIG:-true}
      HUB_ADMIN_SETUP_KEY: ${HUB_ADMIN_SETUP_KEY:-}
      HUB_STT_PII_HASH_KEY: ${HUB_STT_PII_HASH_KEY:-}
      HUB_BOOTSTRAP_ADMIN_LOGIN_ID: ${HUB_BOOTSTRAP_ADMIN_LOGIN_ID:-admin}
      HUB_BOOTSTRAP_ADMIN_PASSWORD: ${HUB_BOOTSTRAP_ADMIN_PASSWORD:-}
      HUB_PUBLIC_BASE_URL: ${HUB_PUBLIC_BASE_URL:-}
      HUB_ALLOW_SHARED_CONNECTOR_FALLBACK: ${HUB_ALLOW_SHARED_CONNECTOR_FALLBACK:-false}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN:-}
      GOOGLE_ACCESS_TOKEN: ${GOOGLE_ACCESS_TOKEN:-}
      SLACK_TOKEN: ${SLACK_TOKEN:-}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      SLACK_TEAM_ID: ${SLACK_TEAM_ID:-}
      NOTION_TOKEN: ${NOTION_TOKEN:-}
      NOTION_CLIENT_ID: ${NOTION_CLIENT_ID:-}
      NOTION_CLIENT_SECRET: ${NOTION_CLIENT_SECRET:-}
    volumes:
      - type: bind
        source: ${HUB_STORAGE_DATA_DIR:?HUB_STORAGE_DATA_DIR is required}
        target: /app/data/storage
    expose:
      - "8080"
    networks:
      - hub-internal
      - hub-web
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Hub does not route through the shared MOVEAI Caddy (dahum/moveai/yellow-server keep using that
  # instance separately). This host port is hub's own direct public entry point - reachable at
  # http://<HUB_PUBLIC_DOMAIN>:<HUB_HOST_PORT> once that port is forwarded to this machine.
  caddy:
    image: caddy:2.10-alpine
    pull_policy: never
    container_name: hub-caddy
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HUB_HOST_PORT:-9070}:80"
    volumes:
      - type: bind
        source: ${HUB_CADDYFILE:?HUB_CADDYFILE is required}
        target: /etc/caddy/Caddyfile
        read_only: true
    networks:
      - hub-web
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  hub-internal:
    name: hub-internal
  hub-web:
    name: hub-web
