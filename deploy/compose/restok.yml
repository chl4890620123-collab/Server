services:
  mariadb:
    image: ${RESTOK_MARIADB_IMAGE:?RESTOK_MARIADB_IMAGE is required}
    pull_policy: never
    container_name: restok-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_DATABASE: ${DB_NAME:?DB_NAME is required}
      MARIADB_USER: ${DB_USER:?DB_USER is required}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    volumes:
      - type: bind
        source: ${RESTOK_DB_DATA_DIR:?RESTOK_DB_DATA_DIR is required}
        target: /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 15s
    networks:
      - restok-internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ai:
    image: ${RESTOK_AI_IMAGE:?RESTOK_AI_IMAGE is required}
    pull_policy: never
    container_name: restok-ai
    restart: unless-stopped
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      AI_MAX_IMAGE_BYTES: ${AI_MAX_IMAGE_BYTES:-10485760}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - restok-internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ${RESTOK_BACKEND_IMAGE:?RESTOK_BACKEND_IMAGE is required}
    pull_policy: never
    container_name: restok-backend
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      ai:
        condition: service_started
    environment:
      DB_URL: jdbc:mariadb://mariadb:3306/${DB_NAME:?DB_NAME is required}?useUnicode=true&characterEncoding=UTF-8
      DB_USERNAME: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_SERVICE_BASE_URL: http://ai:8000
      FILE_UPLOAD_DIR: /app/data/uploads/
      STATIC_FILE_LOCATION: file:/app/data/uploads/
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:9050}
      DB_CHARSET_MIGRATION_ENABLED: ${DB_CHARSET_MIGRATION_ENABLED:-false}
      DB_CHARSET_MIGRATION_LOCK_WAIT_SECONDS: ${DB_CHARSET_MIGRATION_LOCK_WAIT_SECONDS:-10}
      JPA_SHOW_SQL: "false"
    volumes:
      - type: bind
        source: ${RESTOK_UPLOAD_DATA_DIR:?RESTOK_UPLOAD_DATA_DIR is required}
        target: /app/data/uploads
    networks:
      - restok-internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ${RESTOK_FRONTEND_IMAGE:?RESTOK_FRONTEND_IMAGE is required}
    pull_policy: never
    container_name: restok-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - restok-internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: ${RESTOK_CADDY_IMAGE:?RESTOK_CADDY_IMAGE is required}
    pull_policy: never
    container_name: restok-caddy
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "127.0.0.1:${RESTOK_LOCAL_PORT:-9050}:8080"
    volumes:
      - type: bind
        source: ${RESTOK_CADDYFILE:?RESTOK_CADDYFILE is required}
        target: /etc/caddy/Caddyfile
        read_only: true
    networks:
      - restok-internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  public-tunnel:
    image: ${RESTOK_CLOUDFLARED_IMAGE:?RESTOK_CLOUDFLARED_IMAGE is required}
    pull_policy: never
    container_name: restok-public-tunnel
    restart: unless-stopped
    depends_on:
      - caddy
    command: ["tunnel", "--no-autoupdate", "--url", "http://caddy:8080"]
    networks:
      - restok-internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  restok-internal:
    name: restok-internal
