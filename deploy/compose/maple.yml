services:
  maple-db:
    image: mariadb:11.4
    pull_policy: never
    container_name: maple-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:?DB_NAME is required}
      MARIADB_USER: ${DB_USER:?DB_USER is required}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    volumes:
      - type: bind
        source: ${MAPLE_DB_DATA_DIR:?MAPLE_DB_DATA_DIR is required}
        target: /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 15s
    networks:
      - maple-internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  maple-app:
    image: python:3.12-slim
    pull_policy: never
    container_name: maple-app
    restart: unless-stopped
    working_dir: /app
    depends_on:
      maple-db:
        condition: service_healthy
    environment:
      PYTHONPATH: /deps
      DB_ENGINE: mariadb
      DB_HOST: maple-db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    command:
      - sh
      - -c
      - >-
        if [ ! -f /deps/uvicorn/__init__.py ] || [ ! -f /deps/fastapi/__init__.py ]; then
          python -m pip install --disable-pip-version-check --no-cache-dir --target /deps -r /app/requirements.txt;
        fi;
        exec python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - type: bind
        source: ${MAPLE_SOURCE_DIR:?MAPLE_SOURCE_DIR is required}
        target: /app
        read_only: true
      - type: bind
        source: ${MAPLE_PYTHON_DEPS_DIR:?MAPLE_PYTHON_DEPS_DIR is required}
        target: /deps
    networks:
      - maple-internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  maple-caddy:
    image: caddy:2.10-alpine
    pull_policy: never
    container_name: maple-caddy
    restart: unless-stopped
    depends_on:
      maple-app:
        condition: service_started
    ports:
      - "127.0.0.1:${MAPLE_LOCAL_PORT:-9040}:8080"
    volumes:
      - type: bind
        source: ${MAPLE_CADDYFILE:?MAPLE_CADDYFILE is required}
        target: /etc/caddy/Caddyfile
        read_only: true
    networks:
      - maple-internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  maple-public-tunnel:
    image: caddy:2.10-alpine
    pull_policy: never
    container_name: maple-public-tunnel
    restart: unless-stopped
    depends_on:
      - maple-caddy
    entrypoint: ["/usr/local/bin/cloudflared"]
    command: ["tunnel", "--no-autoupdate", "--url", "http://maple-caddy:8080"]
    volumes:
      - type: bind
        source: ${MAPLE_CLOUDFLARED_BINARY:?MAPLE_CLOUDFLARED_BINARY is required}
        target: /usr/local/bin/cloudflared
        read_only: true
    networks:
      - maple-internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  maple-internal:
    name: maple-internal
