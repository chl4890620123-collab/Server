services:
  maple-db:
    image: ${MARIADB_IMAGE:-mariadb:11.4}
    container_name: maple-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:?DB_NAME is required}
      MARIADB_USER: ${DB_USER:?DB_USER is required}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    volumes:
      - "${MAPLE_DB_DATA_DIR:?MAPLE_DB_DATA_DIR is required}:/var/lib/mysql"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - maple-internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  maple-app:
    image: ${MAPLE_IMAGE:?MAPLE_IMAGE is required}
    container_name: maple-app
    restart: unless-stopped
    depends_on:
      maple-db:
        condition: service_healthy
    environment:
      DB_ENGINE: mariadb
      DB_HOST: maple-db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN is required}
      DEFAULT_FEE_RATE: ${DEFAULT_FEE_RATE:-0.05}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      - "${BIND_HOST:-0.0.0.0}:${APP_PORT:-9040}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    networks:
      - maple-internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  maple-internal:
    name: maple-internal
