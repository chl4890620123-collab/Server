name: Deploy Maple via existing SSH fallback

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-maple-ssh.yml"
      - "deploy/scripts/run-maple-deploy.ps1"

permissions:
  contents: write

concurrency:
  group: server-maple-ssh-fallback
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Server repository
        uses: actions/checkout@v4

      - name: Detect existing Server SSH configuration
        id: ssh
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          available=false
          if [ -n "$SERVER_HOST" ] && [ -n "$SERVER_USER" ] && { [ -n "$SERVER_SSH_KEY" ] || [ -n "$SERVER_PASSWORD" ]; }; then
            available=true
          fi
          echo "available=$available" >> "$GITHUB_OUTPUT"

      - name: Probe mini PC SSH
        id: probe
        if: steps.ssh.outputs.available == 'true'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 30s
          command_timeout: 1m
          capture_stdout: true
          script: echo maple-ssh-ok

      - name: Deploy Maple through existing mini PC SSH
        id: deploy_maple
        if: steps.ssh.outputs.available == 'true' && steps.probe.outcome == 'success'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 30s
          command_timeout: 25m
          capture_stdout: true
          script: |
            if not exist C:\home\server mkdir C:\home\server
            if not exist C:\home\server\app git clone https://github.com/chl4890620123-collab/Server.git C:\home\server\app
            cd /d C:\home\server\app && git reset --hard HEAD && git clean -fd && git fetch --prune origin main && git checkout -B main origin/main && git reset --hard origin/main && git clean -fd && powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File C:\home\server\app\deploy\scripts\run-maple-deploy.ps1

      - name: Record SSH and deployment result
        shell: bash
        env:
          DEPLOY_STDOUT: ${{ steps.deploy_maple.outputs.stdout }}
        run: |
          set -euo pipefail
          available='${{ steps.ssh.outputs.available }}'
          probe='${{ steps.probe.outcome }}'
          deployment='${{ steps.deploy_maple.outcome }}'
          [ -n "$probe" ] || probe=skipped
          [ -n "$deployment" ] || deployment=skipped

          mkdir -p deploy/status
          cat > deploy/status/transport.txt <<EOF
          ssh_fallback_available=$available
          ssh_connection=$probe
          deployment=$deployment
          EOF
          printf '%s\n' "$DEPLOY_STDOUT" > deploy/status/ssh-output.txt

          if [ "$deployment" = "success" ]; then
            public_url="$(printf '%s\n' "$DEPLOY_STDOUT" | grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' | tail -n 1 || true)"
            maple_sha="$(printf '%s\n' "$DEPLOY_STDOUT" | sed -n 's/^.*\[maple\] source SHA: \([0-9a-f]\{40\}\).*$/\1/p' | tail -n 1)"
            if [ -z "$public_url" ]; then
              echo 'Deployment succeeded but public URL was not captured.'
              deployment=failure
              sed -i 's/^deployment=.*/deployment=failure/' deploy/status/transport.txt
            else
              cat > deploy/status/maple.txt <<EOF
          maple_sha=$maple_sha
          public_url=$public_url
          public_health=$public_url/api/health
          EOF
            fi
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/status/transport.txt deploy/status/ssh-output.txt
          if [ -f deploy/status/maple.txt ]; then
            git add deploy/status/maple.txt
          fi
          if ! git diff --cached --quiet; then
            git commit -m "chore: record Maple deployment result"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Enforce deployment result
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ steps.ssh.outputs.available }}' != 'true' ]; then
            echo 'Existing SSH configuration is unavailable; self-hosted runner remains the deployment path.'
            exit 0
          fi
          if [ '${{ steps.probe.outcome }}' != 'success' ]; then
            echo 'SSH connection probe failed.'
            exit 1
          fi
          if [ '${{ steps.deploy_maple.outcome }}' != 'success' ]; then
            echo 'Maple remote deployment failed.'
            exit 1
          fi
