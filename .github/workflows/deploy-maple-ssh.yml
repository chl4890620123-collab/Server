name: Deploy Maple via existing SSH fallback

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-maple-ssh.yml"
      - "deploy/scripts/publish-maple-status.ps1"

permissions:
  contents: write

concurrency:
  group: server-maple-ssh-fallback
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Server repository
        uses: actions/checkout@v4

      - name: Detect existing Server SSH configuration
        id: ssh
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          available=false
          if [ -n "$SERVER_HOST" ] && [ -n "$SERVER_USER" ] && { [ -n "$SERVER_SSH_KEY" ] || [ -n "$SERVER_PASSWORD" ]; }; then
            available=true
          fi
          echo "available=$available" >> "$GITHUB_OUTPUT"

      - name: Record SSH fallback availability
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy/status
          printf 'ssh_fallback_available=%s\n' '${{ steps.ssh.outputs.available }}' > deploy/status/transport.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/status/transport.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: record Maple deployment transport"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Deploy Maple through existing mini PC SSH
        if: steps.ssh.outputs.available == 'true'
        uses: appleboy/ssh-action@v1.2.2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: GH_TOKEN
          command_timeout: 25m
          script_stop: true
          script: |
            if not exist C:\home\server mkdir C:\home\server
            if not exist C:\home\server\app git clone https://github.com/chl4890620123-collab/Server.git C:\home\server\app
            cd /d C:\home\server\app && git reset --hard HEAD && git clean -fd && git fetch --prune origin main && git checkout -B main origin/main && git reset --hard origin/main && git clean -fd && powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File C:\home\server\app\deploy\scripts\deploy-maple.ps1 && powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File C:\home\server\app\deploy\scripts\publish-maple-status.ps1

      - name: Explain unavailable fallback
        if: steps.ssh.outputs.available != 'true'
        shell: bash
        run: echo "Existing Server SSH secrets are not configured; self-hosted runner remains the deployment path."
