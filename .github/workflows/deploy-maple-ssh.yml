name: Deploy Maple via existing SSH fallback

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-maple-ssh.yml"
      - "deploy/scripts/run-maple-deploy.ps1"
      - "deploy/scripts/deploy-maple.ps1"
      - "deploy/compose/maple.yml"
      - "deploy/caddy/**"

permissions:
  contents: write

concurrency:
  group: server-maple-ssh-fallback
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Server repository
        uses: actions/checkout@v4

      - name: Detect existing Server SSH configuration
        id: ssh
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          available=false
          if [ -n "$SERVER_HOST" ] && [ -n "$SERVER_USER" ] && { [ -n "$SERVER_SSH_KEY" ] || [ -n "$SERVER_PASSWORD" ]; }; then
            available=true
          fi
          echo "available=$available" >> "$GITHUB_OUTPUT"

      - name: Run Maple deployment with native SSH
        id: deploy
        if: steps.ssh.outputs.available == 'true'
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p deploy/status "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          port="${SERVER_PORT:-22}"
          key_args=()

          if [ -n "$SERVER_SSH_KEY" ]; then
            printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/maple_deploy_key"
            chmod 600 "$HOME/.ssh/maple_deploy_key"
            key_args=(-i "$HOME/.ssh/maple_deploy_key")
          fi

          if [ -n "$SERVER_PASSWORD" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
            export SSHPASS="$SERVER_PASSWORD"
            auth=(sshpass -e ssh "${key_args[@]}")
          else
            auth=(ssh "${key_args[@]}")
          fi

          cat > "$RUNNER_TEMP/maple-remote.ps1" <<'PWSH'
          $ErrorActionPreference = 'Stop'
          $path = 'C:\home\server\app'
          $parent = Split-Path $path -Parent
          New-Item -ItemType Directory -Force -Path $parent | Out-Null

          if (-not (Test-Path (Join-Path $path '.git'))) {
              if (Test-Path $path) {
                  Remove-Item -Recurse -Force $path
              }
              git clone 'https://github.com/chl4890620123-collab/Server.git' $path
              if ($LASTEXITCODE -ne 0) { throw 'Server clone failed' }
          }

          Set-Location $path
          git reset --hard HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Server reset failed' }
          git clean -fd
          if ($LASTEXITCODE -ne 0) { throw 'Server clean failed' }
          git fetch --prune origin main
          if ($LASTEXITCODE -ne 0) { throw 'Server fetch failed' }
          git checkout -B main origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Server checkout failed' }
          git reset --hard origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Server main reset failed' }
          git clean -fd
          if ($LASTEXITCODE -ne 0) { throw 'Server final clean failed' }

          & '.\deploy\scripts\run-maple-deploy.ps1'
          PWSH

          encoded="$(iconv -f UTF-8 -t UTF-16LE "$RUNNER_TEMP/maple-remote.ps1" | base64 -w0)"
          remote_command="powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand $encoded"

          set +e
          output="$("${auth[@]}" -p "$port" -o BatchMode=no -o NumberOfPasswordPrompts=1 -o ConnectTimeout=30 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$SERVER_USER@$SERVER_HOST" "$remote_command" 2>&1)"
          code=$?
          set -e

          printf '%s\n' "$output" | tee deploy/status/ssh-output.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Record deployment result
        id: record
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy/status
          available='${{ steps.ssh.outputs.available }}'
          exit_code='${{ steps.deploy.outputs.exit_code }}'
          [ -n "$exit_code" ] || exit_code=999
          final=failure
          public_url=''
          maple_sha=''

          if [ "$available" != 'true' ]; then
            final=skipped
          elif [ "$exit_code" = '0' ]; then
            public_url="$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' deploy/status/ssh-output.txt | tail -n 1 || true)"
            maple_sha="$(sed -n 's/^.*\[maple\] source SHA: \([0-9a-f]\{40\}\).*$/\1/p' deploy/status/ssh-output.txt | tail -n 1)"
            if [ -n "$public_url" ]; then
              final=success
              cat > deploy/status/maple.txt <<EOF
          maple_sha=$maple_sha
          public_url=$public_url
          public_health=$public_url/api/health
          EOF
            fi
          fi

          cat > deploy/status/transport.txt <<EOF
          ssh_fallback_available=$available
          ssh_connection=$([ "$available" = 'true' ] && echo success || echo unavailable)
          remote_exit_code=$exit_code
          deployment=$final
          EOF
          echo "final=$final" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/status/transport.txt
          if [ -f deploy/status/ssh-output.txt ]; then git add deploy/status/ssh-output.txt; fi
          if [ -f deploy/status/maple.txt ]; then git add deploy/status/maple.txt; fi
          if ! git diff --cached --quiet; then
            git commit -m "chore: record Maple deployment result"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Enforce deployment result
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ steps.ssh.outputs.available }}' != 'true' ]; then
            echo 'Existing SSH configuration is unavailable; self-hosted runner remains the deployment path.'
            exit 1
          fi
          if [ '${{ steps.record.outputs.final }}' != 'success' ]; then
            echo 'Maple deployment or public URL verification failed.'
            exit 1
          fi
