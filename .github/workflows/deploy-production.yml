name: Central production deployment

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        default: all
        type: choice
        options: [all, maple, restok]
      force:
        description: Force redeploy
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - '.ops-trigger/maple.txt'

permissions:
  contents: read

concurrency:
  group: production-deployment-orchestrator
  cancel-in-progress: false

jobs:
  deploy-maple:
    if: ${{ github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'maple' }}
    uses: ./.github/workflows/_deploy-service.yml
    with:
      service: maple
      force: ${{ github.event_name == 'push' || inputs.force }}
    secrets: inherit

  deploy-restok:
    if: ${{ github.event_name != 'push' && (inputs.target == 'all' || inputs.target == 'restok') }}
    uses: ./.github/workflows/_deploy-service.yml
    with:
      service: restok
      force: ${{ inputs.force }}
    secrets: inherit
