name: Central production deployment

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        default: all
        type: choice
        options: [all, maple, restok, aitm]
      force:
        description: Force redeploy
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Server is the only deployment entrypoint. Never cancel an active production restart.
concurrency:
  group: production-deployment-orchestrator
  cancel-in-progress: false

jobs:
  reset-all:
    if: ${{ inputs.target == 'all' }}
    uses: ./.github/workflows/_reset-production.yml
    secrets: inherit

  # Priority 1: Maple. On a full restart it starts first.
  maple:
    if: ${{ always() && (inputs.target == 'all' || inputs.target == 'maple') && (inputs.target != 'all' || needs.reset-all.result == 'success') }}
    needs: [reset-all]
    uses: ./.github/workflows/_deploy-service.yml
    with:
      service: maple
      force: ${{ inputs.force }}
    secrets: inherit

  # Priority 2: Restok. It may run alongside Maple, so the long-running cap is two.
  restok:
    if: ${{ always() && (inputs.target == 'all' || inputs.target == 'restok') && (inputs.target != 'all' || needs.reset-all.result == 'success') }}
    needs: [reset-all]
    uses: ./.github/workflows/_deploy-service.yml
    with:
      service: restok
      force: ${{ inputs.force }}
    secrets: inherit

  # Priority 3: Aitm starts only after both higher-priority slots have completed.
  aitm:
    if: ${{ always() && (inputs.target == 'aitm' || (inputs.target == 'all' && needs.maple.result == 'success' && needs.restok.result == 'success')) }}
    needs: [maple, restok]
    uses: ./.github/workflows/_deploy-service.yml
    with:
      service: aitm
      force: ${{ inputs.force }}
    secrets: inherit
