name: Central production deployment

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        default: all
        type: choice
        options: [all, maple, restok, hub]
      force:
        description: Force redeploy
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - '.ops-trigger/maple.txt'
      - '.ops-trigger/hub.txt'

permissions:
  contents: read

jobs:
  # Push only touches the workflow via .ops-trigger/*.txt; this tells the two push-triggerable
  # deploy jobs below which one of them the push was actually for, so touching hub's trigger file
  # does not also redeploy maple (and vice versa). Not needed - and skipped - for workflow_dispatch,
  # which instead targets a service directly through the `target` input.
  detect:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      maple: ${{ steps.filter.outputs.maple }}
      hub: ${{ steps.filter.outputs.hub }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            maple:
              - '.ops-trigger/maple.txt'
            hub:
              - '.ops-trigger/hub.txt'

  # Each service gets its own concurrency lane instead of one shared lock across every app -
  # a stuck/slow hub deploy no longer blocks maple or restok from deploying. cancel-in-progress
  # means retriggering the same service cancels the previous attempt immediately instead of
  # queuing behind it until its internal timeout expires.
  deploy-maple:
    needs: [detect]
    if: ${{ always() && ((github.event_name == 'push' && needs.detect.outputs.maple == 'true') || inputs.target == 'all' || inputs.target == 'maple') }}
    concurrency:
      group: deploy-maple
      cancel-in-progress: true
    uses: ./.github/workflows/_deploy-service.yml
    with:
      service: maple
      force: ${{ github.event_name == 'push' || inputs.force }}
    secrets: inherit

  deploy-restok:
    if: ${{ github.event_name != 'push' && (inputs.target == 'all' || inputs.target == 'restok') }}
    concurrency:
      group: deploy-restok
      cancel-in-progress: true
    uses: ./.github/workflows/_deploy-service.yml
    with:
      service: restok
      force: ${{ inputs.force }}
    secrets: inherit

  deploy-hub:
    needs: [detect]
    if: ${{ always() && ((github.event_name == 'push' && needs.detect.outputs.hub == 'true') || inputs.target == 'all' || inputs.target == 'hub') }}
    concurrency:
      group: deploy-hub
      cancel-in-progress: true
    uses: ./.github/workflows/_deploy-service.yml
    with:
      service: hub
      force: ${{ github.event_name == 'push' || inputs.force }}
    secrets: inherit
