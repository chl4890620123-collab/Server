name: Deploy Maple manually on self-hosted runner

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: server-maple-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30

    steps:
      - name: Checkout Server repository
        uses: actions/checkout@v5

      - name: Force deploy Maple on mini PC
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\deploy\scripts\run-maple-deploy.ps1 -Force

      - name: Record public deployment URL
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'deploy/status/maple.txt')) {
            throw 'Maple deployment status file was not created.'
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/status/maple.txt
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "chore: record deployed Maple URL"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to commit Maple deployment status.' }
          git pull --rebase origin main
          if ($LASTEXITCODE -ne 0) { throw 'Failed to rebase Maple deployment status.' }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Failed to push Maple deployment status.' }

      - name: Diagnostics on failure
        if: failure()
        shell: powershell
        run: |
          Write-Host '=== docker ps -a ==='
          docker ps -a
          Write-Host '=== Maple container logs ==='
          docker logs --tail 120 maple-db 2>$null
          docker logs --tail 120 maple-app 2>$null
          docker logs --tail 120 maple-caddy 2>$null
          docker logs --tail 120 maple-public-tunnel 2>$null
