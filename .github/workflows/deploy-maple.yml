name: Deploy Maple centrally

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-maple.yml"
      - "deploy/compose/maple.yml"
      - "deploy/scripts/deploy-maple.ps1"
      - "deploy/runtime/maple.env.example"
      - "deploy/caddy/maple.Caddyfile.example"
      - "deploy/README.md"
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: server-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Server repository
        uses: actions/checkout@v4

      - name: Checkout latest Maple source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/chl4890620123-collab/maple.git sources/maple

      - name: Resolve Maple image and source SHA
        id: maple
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git -C sources/maple rev-parse HEAD)"
          image="ghcr.io/chl4890620123-collab/server-maple"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether exact Maple image already exists
        id: image_check
        shell: bash
        run: |
          set -euo pipefail
          ref="${{ steps.maple.outputs.image }}:${{ steps.maple.outputs.sha }}"
          if docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python for new Maple revision
        if: steps.image_check.outputs.exists != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Maple test dependencies
        if: steps.image_check.outputs.exists != 'true'
        shell: bash
        working-directory: sources/maple
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run SQLite regression tests
        if: steps.image_check.outputs.exists != 'true'
        shell: bash
        working-directory: sources/maple
        env:
          DB_ENGINE: sqlite
        run: |
          set -euo pipefail
          PYTHONPATH=. pytest -q

      - name: Start MariaDB integration database
        if: steps.image_check.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name maple-central-ci-db \
            --health-cmd="healthcheck.sh --connect --innodb_initialized" \
            --health-interval=2s \
            --health-timeout=3s \
            --health-retries=30 \
            -e MARIADB_DATABASE=maple_craft \
            -e MARIADB_USER=maple_app \
            -e MARIADB_PASSWORD=maple_ci_password \
            -e MARIADB_ROOT_PASSWORD=maple_ci_root_password \
            -p 127.0.0.1:33308:3306 \
            mariadb:11.4

          for attempt in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' maple-central-ci-db 2>/dev/null || true)"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              docker logs maple-central-ci-db
              exit 1
            fi
            sleep 2
          done

          docker logs maple-central-ci-db
          exit 1

      - name: Run MariaDB integration regression tests
        if: steps.image_check.outputs.exists != 'true'
        shell: bash
        working-directory: sources/maple
        env:
          DB_ENGINE: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: 33308
          DB_NAME: maple_craft
          DB_USER: maple_app
          DB_PASSWORD: maple_ci_password
        run: |
          set -euo pipefail
          PYTHONPATH=. pytest -q

      - name: Stop MariaDB integration database
        if: always() && steps.image_check.outputs.exists != 'true'
        shell: bash
        run: docker rm -f maple-central-ci-db >/dev/null 2>&1 || true

      - name: Build and push Maple image
        if: steps.image_check.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./sources/maple
          file: ./sources/maple/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.maple.outputs.image }}:${{ steps.maple.outputs.sha }}
            ${{ steps.maple.outputs.image }}:latest
          cache-from: type=gha,scope=maple-central
          cache-to: type=gha,mode=max,scope=maple-central
          labels: |
            org.opencontainers.image.source=https://github.com/chl4890620123-collab/maple
            org.opencontainers.image.revision=${{ steps.maple.outputs.sha }}

      - name: Deploy Maple through Server runtime
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 20m
          script: |
            if not exist C:\home\server mkdir C:\home\server
            if not exist C:\home\server\app git clone https://github.com/${{ github.repository }}.git C:\home\server\app
            cd /d C:\home\server\app && git reset --hard HEAD && git clean -fd && git fetch --prune origin main && git checkout -B main origin/main && git reset --hard origin/main && git clean -fd && powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File C:\home\server\app\deploy\scripts\deploy-maple.ps1 -MapleImage "${{ steps.maple.outputs.image }}:${{ steps.maple.outputs.sha }}" -SourceSha "${{ steps.maple.outputs.sha }}" -DeploymentReason "${{ github.event_name }}" -RegistryUser "${{ github.actor }}" -RegistryToken "${{ secrets.GITHUB_TOKEN }}"
