name: decommission-old-services

# One-off cleanup, part 2: removes the leftover ghcr.io/est-ai-challengers-31/saver-ai and
# saver-backend images - one per past commit from the old pre-built-bundle deploy mechanism for
# the now-removed maple/restok/aitm services (the "saver" repo was their central build/transfer
# point). Confirmed via a full `docker ps -a` that no container anywhere on this box references
# either image family. Touches nothing named dahum/moveai/yellow-server - out of scope. Manual
# trigger only - delete this workflow file after running it once.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decommission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_PORT: ${{ secrets.SERVER_PORT }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
    steps:
      - name: Remove old saver-ai/saver-backend images over SSH
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SERVER_HOST" ] || [ -z "$SERVER_USER" ] || { [ -z "$SERVER_SSH_KEY" ] && [ -z "$SERVER_PASSWORD" ]; }; then
            echo 'Server SSH secrets are not configured in the Server repository.' >&2
            exit 1
          fi
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          port="${SERVER_PORT:-22}"
          key_args=()
          if [ -n "$SERVER_SSH_KEY" ]; then
            printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/server_deploy_key"
            chmod 600 "$HOME/.ssh/server_deploy_key"
            key_args=(-i "$HOME/.ssh/server_deploy_key")
          fi
          if [ -n "$SERVER_PASSWORD" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
            export SSHPASS="$SERVER_PASSWORD"
            auth=(sshpass -e ssh "${key_args[@]}")
          else
            auth=(ssh "${key_args[@]}")
          fi
          ssh_options=(-o BatchMode=no -o NumberOfPasswordPrompts=1 -o ConnectTimeout=30 -o ServerAliveInterval=10 -o ServerAliveCountMax=60 -o TCPKeepAlive=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)

          remote_script="$RUNNER_TEMP/decommission-saver-images.ps1"
          cat > "$remote_script" <<'PWSH'
          $ErrorActionPreference = 'Continue'

          [Console]::Out.WriteLine('--- safety re-check: any container using saver-ai/saver-backend? (expect none) ---')
          docker ps -a --format "{{.Names}}: {{.Image}}" 2>&1 | Select-String -Pattern 'saver-ai|saver-backend' | Write-Output

          [Console]::Out.WriteLine('--- removing saver-ai / saver-backend images ---')
          $targets = docker images --format "{{.Repository}}:{{.Tag}}" 2>&1 |
            Select-String -Pattern '^ghcr\.io/est-ai-challengers-31/saver-(ai|backend):'
          $count = 0
          foreach ($img in $targets) {
            $name = $img.ToString().Trim()
            docker image rm -f $name 2>&1 | Out-Null
            $count++
          }
          [Console]::Out.WriteLine("removed $count image tags")

          [Console]::Out.WriteLine('--- disk space after ---')
          Get-CimInstance Win32_LogicalDisk -Filter "DriveType=3" | Select-Object DeviceID,@{N='FreeGB';E={[math]::Round($_.FreeSpace/1GB,1)}},@{N='SizeGB';E={[math]::Round($_.Size/1GB,1)}} | Format-Table -AutoSize | Out-String -Width 200 | Write-Output

          [Console]::Out.WriteLine('--- hub containers still healthy (sanity check) ---')
          docker ps --filter "name=hub-" --format "table {{.Names}}\t{{.Status}}" 2>&1 | Write-Output
          PWSH

          wrapper='$writer = New-Object System.IO.StreamWriter([Console]::OpenStandardOutput()); $writer.AutoFlush = $true; [Console]::SetOut($writer); $script = [Console]::In.ReadToEnd(); Invoke-Expression $script'
          encoded_wrapper="$(printf '%s' "$wrapper" | iconv -f UTF-8 -t UTF-16LE | base64 -w0)"
          remote_command="powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand $encoded_wrapper"
          timeout 3m "${auth[@]}" -p "$port" "${ssh_options[@]}" "$SERVER_USER@$SERVER_HOST" "$remote_command" < "$remote_script"
