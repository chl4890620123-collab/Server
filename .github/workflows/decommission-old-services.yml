name: decommission-old-services

# One-off cleanup: removes the leftover Docker images and D:\server-data directories for
# maple/restok/aitm, which are already stopped and fully removed from this repo's deploy
# pipeline (see the commit that removed deploy/compose/{maple,restok,aitm}.yml). Does not touch
# hub or the shared Caddy. Manual trigger only - delete this workflow file after running it once.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decommission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_PORT: ${{ secrets.SERVER_PORT }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
    steps:
      - name: Remove images and data directories over SSH
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SERVER_HOST" ] || [ -z "$SERVER_USER" ] || { [ -z "$SERVER_SSH_KEY" ] && [ -z "$SERVER_PASSWORD" ]; }; then
            echo 'Server SSH secrets are not configured in the Server repository.' >&2
            exit 1
          fi
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          port="${SERVER_PORT:-22}"
          key_args=()
          if [ -n "$SERVER_SSH_KEY" ]; then
            printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/server_deploy_key"
            chmod 600 "$HOME/.ssh/server_deploy_key"
            key_args=(-i "$HOME/.ssh/server_deploy_key")
          fi
          if [ -n "$SERVER_PASSWORD" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
            export SSHPASS="$SERVER_PASSWORD"
            auth=(sshpass -e ssh "${key_args[@]}")
          else
            auth=(ssh "${key_args[@]}")
          fi
          ssh_options=(-o BatchMode=no -o NumberOfPasswordPrompts=1 -o ConnectTimeout=30 -o ServerAliveInterval=10 -o ServerAliveCountMax=60 -o TCPKeepAlive=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)

          remote_script="$RUNNER_TEMP/decommission-old-services.ps1"
          cat > "$remote_script" <<'PWSH'
          $ErrorActionPreference = 'Continue'

          [Console]::Out.WriteLine('--- containers matching aitm/maple/restok (expect none) ---')
          docker ps -a --filter "name=aitm" --filter "name=maple" --filter "name=restok" 2>&1 | Write-Output

          [Console]::Out.WriteLine('--- removing images ---')
          $imageNames = @(
            'maple-production-app:latest',
            'restok-production-ai:latest','restok-production-backend:latest','restok-production-frontend:latest',
            'aitm-production-ai:latest','aitm-production-backend:latest','aitm-production-frontend:latest'
          )
          foreach ($img in $imageNames) {
            docker image rm -f $img 2>&1 | Write-Output
          }
          $ghcrImages = docker images --format "{{.Repository}}:{{.Tag}}" 2>&1 | Select-String -Pattern 'ghcr\.io/est-ai-challengers-31/saver-(aitm|maple)'
          foreach ($img in $ghcrImages) {
            docker image rm -f $img.ToString().Trim() 2>&1 | Write-Output
          }

          [Console]::Out.WriteLine('--- removing D:\server-data directories ---')
          foreach ($dir in @('D:\server-data\aitm','D:\server-data\maple','D:\server-data\restok','D:\server-data\sources\aitm','D:\server-data\sources\maple','D:\server-data\sources\restok')) {
            if (Test-Path $dir) {
              Remove-Item -Recurse -Force $dir -ErrorAction Continue
              [Console]::Out.WriteLine("removed: $dir")
            } else {
              [Console]::Out.WriteLine("already absent: $dir")
            }
          }

          [Console]::Out.WriteLine('--- disk space after ---')
          Get-CimInstance Win32_LogicalDisk -Filter "DriveType=3" | Select-Object DeviceID,@{N='FreeGB';E={[math]::Round($_.FreeSpace/1GB,1)}},@{N='SizeGB';E={[math]::Round($_.Size/1GB,1)}} | Format-Table -AutoSize | Out-String -Width 200 | Write-Output

          [Console]::Out.WriteLine('--- remaining docker images (sanity check) ---')
          docker images 2>&1 | Write-Output
          PWSH

          wrapper='$writer = New-Object System.IO.StreamWriter([Console]::OpenStandardOutput()); $writer.AutoFlush = $true; [Console]::SetOut($writer); $script = [Console]::In.ReadToEnd(); Invoke-Expression $script'
          encoded_wrapper="$(printf '%s' "$wrapper" | iconv -f UTF-8 -t UTF-16LE | base64 -w0)"
          remote_command="powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand $encoded_wrapper"
          timeout 3m "${auth[@]}" -p "$port" "${ssh_options[@]}" "$SERVER_USER@$SERVER_HOST" "$remote_command" < "$remote_script"
