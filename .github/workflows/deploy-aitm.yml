name: Deploy Aitm production

on:
  workflow_dispatch:
    inputs:
      force:
        description: Force image rebuild and redeploy
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-aitm.yml"
      - "deploy/compose/aitm.yml"
      - "deploy/caddy/aitm.Caddyfile"
      - "deploy/runtime/aitm.env.example"
      - "deploy/scripts/deploy-aitm.ps1"
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: server-aitm-production-ssh
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Server repository
        uses: actions/checkout@v5

      - name: Checkout Aitm source
        uses: actions/checkout@v5
        with:
          repository: chl4890620123-collab/Aitm
          ref: main
          path: aitm-source

      - name: Plan Aitm image delivery
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          aitm_sha="$(git -C aitm-source rev-parse HEAD)"
          deployed_sha="$(sed -n 's/^aitm_sha=//p' deploy/status/aitm.txt 2>/dev/null | head -n 1 || true)"
          bundle=false
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ] && [ '${{ inputs.force }}' = 'true' ]; then
            bundle=true
          elif [ -z "$deployed_sha" ] || [ "$deployed_sha" != "$aitm_sha" ]; then
            bundle=true
          fi
          echo "aitm_sha=$aitm_sha" >> "$GITHUB_OUTPUT"
          echo "deployed_sha=$deployed_sha" >> "$GITHUB_OUTPUT"
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"
          echo "Aitm source: $aitm_sha"
          echo "Previously deployed: ${deployed_sha:-none}"
          echo "Build and transfer image bundle: $bundle"

      - name: Detect Server SSH configuration
        id: ssh
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          available=false
          if [ -n "$SERVER_HOST" ] && [ -n "$SERVER_USER" ] && { [ -n "$SERVER_SSH_KEY" ] || [ -n "$SERVER_PASSWORD" ]; }; then
            available=true
          fi
          echo "available=$available" >> "$GITHUB_OUTPUT"

      - name: Record deployment start locally
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy/status
          cat > deploy/status/aitm-transport.txt <<EOF
          run_id=${{ github.run_id }}
          run_attempt=${{ github.run_attempt }}
          event=${{ github.event_name }}
          aitm_sha=${{ steps.plan.outputs.aitm_sha }}
          image_bundle=${{ steps.plan.outputs.bundle }}
          ssh_available=${{ steps.ssh.outputs.available }}
          build=pending
          ssh_connection=pending
          remote_exit_code=pending
          deployment=running
          EOF

      - name: Build Aitm images on GitHub runner
        id: build
        if: steps.plan.outputs.bundle == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull -t aitm-production-ai:latest aitm-source/demo/ai
          docker build --pull -t aitm-production-backend:latest aitm-source/demo
          docker build --pull -t aitm-production-frontend:latest aitm-source/front
          docker pull mariadb:10.11
          docker pull caddy:2.10-alpine
          docker save \
            aitm-production-ai:latest \
            aitm-production-backend:latest \
            aitm-production-frontend:latest \
            mariadb:10.11 \
            caddy:2.10-alpine \
            | gzip -1 > "$RUNNER_TEMP/aitm-images.tar.gz"
          test -s "$RUNNER_TEMP/aitm-images.tar.gz"
          ls -lh "$RUNNER_TEMP/aitm-images.tar.gz"

      - name: Run Aitm deployment with native SSH
        id: deploy
        if: steps.ssh.outputs.available == 'true' && (steps.build.outcome == 'success' || steps.build.outcome == 'skipped')
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          output_file="$RUNNER_TEMP/aitm-ssh-output.txt"
          port="${SERVER_PORT:-22}"
          key_args=()

          if [ -n "$SERVER_SSH_KEY" ]; then
            printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/aitm_deploy_key"
            chmod 600 "$HOME/.ssh/aitm_deploy_key"
            key_args=(-i "$HOME/.ssh/aitm_deploy_key")
          fi

          if [ -n "$SERVER_PASSWORD" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
            export SSHPASS="$SERVER_PASSWORD"
            auth=(sshpass -e ssh "${key_args[@]}")
            transfer=(sshpass -e scp "${key_args[@]}")
          else
            auth=(ssh "${key_args[@]}")
            transfer=(scp "${key_args[@]}")
          fi

          ssh_options=(-o BatchMode=no -o NumberOfPasswordPrompts=1 -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)
          "${auth[@]}" -p "$port" "${ssh_options[@]}" "$SERVER_USER@$SERVER_HOST" "powershell.exe -NoProfile -NonInteractive -Command \"New-Item -ItemType Directory -Force -Path 'C:\\home\\server' | Out-Null\""

          if [ '${{ steps.plan.outputs.bundle }}' = 'true' ]; then
            "${transfer[@]}" -P "$port" -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              "$RUNNER_TEMP/aitm-images.tar.gz" \
              "$SERVER_USER@$SERVER_HOST:C:/home/server/aitm-images.tar.gz"
          fi

          cat > "$RUNNER_TEMP/aitm-remote.ps1" <<'PWSH'
          $ErrorActionPreference = 'Stop'
          $path = 'C:\home\server\app'
          $parent = Split-Path $path -Parent
          New-Item -ItemType Directory -Force -Path $parent | Out-Null

          if (-not (Test-Path (Join-Path $path '.git'))) {
              if (Test-Path $path) { Remove-Item -Recurse -Force $path }
              git clone 'https://github.com/chl4890620123-collab/Server.git' $path
              if ($LASTEXITCODE -ne 0) { throw 'Server clone failed' }
          }

          Set-Location $path
          git reset --hard HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Server reset failed' }
          git clean -fd
          if ($LASTEXITCODE -ne 0) { throw 'Server clean failed' }
          git fetch --prune origin main
          if ($LASTEXITCODE -ne 0) { throw 'Server fetch failed' }
          git checkout -B main origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Server checkout failed' }
          git reset --hard origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Server main reset failed' }
          git clean -fd
          if ($LASTEXITCODE -ne 0) { throw 'Server final clean failed' }

          $expectedSha = '${{ steps.plan.outputs.aitm_sha }}'
          $remoteHeadLine = (git ls-remote 'https://github.com/chl4890620123-collab/Aitm.git' 'refs/heads/main' | Out-String).Trim()
          if (-not $remoteHeadLine) { throw 'Could not resolve Aitm remote main SHA' }
          $remoteHead = ($remoteHeadLine -split '\s+')[0]
          if ($remoteHead -ne $expectedSha) {
              throw "Aitm main changed during deployment: expected=$expectedSha actual=$remoteHead"
          }

          $bundle = 'C:\home\server\aitm-images.tar.gz'
          $bundleExpected = '${{ steps.plan.outputs.bundle }}' -eq 'true'
          if ($bundleExpected) {
              if (-not (Test-Path $bundle)) { throw 'Aitm image bundle was not transferred.' }
              Write-Host '[aitm] loading prebuilt image bundle from GitHub Actions'
              docker load --input $bundle
              if ($LASTEXITCODE -ne 0) { throw 'Failed to load Aitm image bundle.' }
              Remove-Item -Force $bundle
          } elseif (Test-Path $bundle) {
              Remove-Item -Force $bundle
          }

          $forceDeploy = ('${{ github.event_name }}' -ne 'schedule') -or ('${{ inputs.force }}' -eq 'true')
          & '.\deploy\scripts\deploy-aitm.ps1' -ExpectedSha $expectedSha -Force:$forceDeploy
          if (-not $?) { throw 'Aitm deploy script failed' }
          PWSH

          encoded="$(iconv -f UTF-8 -t UTF-16LE "$RUNNER_TEMP/aitm-remote.ps1" | base64 -w0)"
          remote_command="powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand $encoded"

          set +e
          output="$("${auth[@]}" -p "$port" "${ssh_options[@]}" "$SERVER_USER@$SERVER_HOST" "$remote_command" 2>&1)"
          code=$?
          set -e

          printf '%s\n' "$output" | tee "$output_file"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Record deployment result
        if: always()
        id: record
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy/status
          output_file="$RUNNER_TEMP/aitm-ssh-output.txt"
          available='${{ steps.ssh.outputs.available }}'
          build_outcome='${{ steps.build.outcome }}'
          deploy_outcome='${{ steps.deploy.outcome }}'
          exit_code='${{ steps.deploy.outputs.exit_code }}'
          [ -n "$exit_code" ] || exit_code=999
          final=failure
          connection=not_attempted
          public_url=''
          aitm_sha=''

          if [ "$available" != 'true' ]; then
            final=skipped
          elif [ "$build_outcome" = 'failure' ]; then
            final=failure
          elif [ "$deploy_outcome" = 'success' ]; then
            connection=attempted
            if [ "$exit_code" = '0' ] && [ -f "$output_file" ]; then
              public_url="$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' "$output_file" | tail -n 1 || true)"
              aitm_sha="$(sed -n 's/^.*\[aitm\] source SHA: \([0-9a-f]\{40\}\).*$/\1/p' "$output_file" | tail -n 1)"
              if [ -n "$public_url" ] && [ -n "$aitm_sha" ] && [ "$aitm_sha" = '${{ steps.plan.outputs.aitm_sha }}' ]; then
                final=success
                cat > deploy/status/aitm.txt <<EOF
          aitm_sha=$aitm_sha
          public_url=$public_url
          public_health=$public_url/api/health
          local_url=http://127.0.0.1:9060
          EOF
              fi
            fi
          elif [ "$deploy_outcome" = 'failure' ]; then
            connection=attempted
          fi

          cat > deploy/status/aitm-transport.txt <<EOF
          run_id=${{ github.run_id }}
          run_attempt=${{ github.run_attempt }}
          event=${{ github.event_name }}
          aitm_sha=${{ steps.plan.outputs.aitm_sha }}
          image_bundle=${{ steps.plan.outputs.bundle }}
          ssh_available=$available
          build=$build_outcome
          ssh_connection=$connection
          remote_exit_code=$exit_code
          deployment=$final
          EOF
          echo "final=$final" >> "$GITHUB_OUTPUT"

          tmpdir="$(mktemp -d)"
          cp deploy/status/aitm-transport.txt "$tmpdir/aitm-transport.txt"
          if [ -f deploy/status/aitm.txt ]; then cp deploy/status/aitm.txt "$tmpdir/aitm.txt"; fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          published=false
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p deploy/status
            cp "$tmpdir/aitm-transport.txt" deploy/status/aitm-transport.txt
            if [ -f "$tmpdir/aitm.txt" ]; then cp "$tmpdir/aitm.txt" deploy/status/aitm.txt; fi
            git add deploy/status/aitm-transport.txt
            if [ -f "$tmpdir/aitm.txt" ]; then git add deploy/status/aitm.txt; fi
            if git diff --cached --quiet; then
              published=true
              break
            fi
            git commit -m "chore: record Aitm deployment result"
            if git push origin HEAD:main; then
              published=true
              break
            fi
            echo "Aitm status push raced with another deployment; retrying ($attempt/5)."
            sleep $((attempt * 2))
          done
          rm -rf "$tmpdir"
          if [ "$published" != 'true' ]; then
            echo 'Failed to publish Aitm deployment status after retries.'
            exit 1
          fi

      - name: Enforce deployment result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ steps.record.outputs.final }}' != 'success' ]; then
            echo 'Aitm build, deployment, or health verification failed.'
            exit 1
          fi
