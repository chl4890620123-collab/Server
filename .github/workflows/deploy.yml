name: Infrastructure smoke test

on:
  workflow_dispatch:

concurrency:
  group: server-infra-smoke
  cancel-in-progress: false

jobs:
  smoke-deploy:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 10
    env:
      TEST_PORT: ${{ vars.TEST_PORT || '9010' }}

    steps:
      - name: Checkout Server repository
        uses: actions/checkout@v4

      - name: Docker preflight
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          docker version
          if ($LASTEXITCODE -ne 0) { throw 'Docker Engine is not available.' }
          docker compose version
          if ($LASTEXITCODE -ne 0) { throw 'Docker Compose is not available.' }

      - name: Start smoke frontend
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          docker compose up -d --build --remove-orphans
          if ($LASTEXITCODE -ne 0) { throw 'docker compose up failed.' }

      - name: Verify health endpoint
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "http://127.0.0.1:$env:TEST_PORT/health"
          $healthy = $false

          for ($attempt = 1; $attempt -le 30; $attempt++) {
            try {
              $response = Invoke-WebRequest -UseBasicParsing -Uri $url -TimeoutSec 3
              if ($response.StatusCode -eq 200 -and $response.Content.Trim() -eq 'ok') {
                $healthy = $true
                break
              }
            } catch {
              Start-Sleep -Seconds 2
            }
          }

          if (-not $healthy) {
            docker compose ps
            docker compose logs --tail 100
            throw "Smoke frontend health check failed: $url"
          }

          Write-Host "Smoke frontend is healthy: $url"
