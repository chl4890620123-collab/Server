name: Infrastructure smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy.yml"
      - "Dockerfile"
      - "docker-compose.yml"
      - "nginx/**"
      - "public/**"

permissions:
  contents: write

concurrency:
  group: server-infra-smoke
  cancel-in-progress: false

jobs:
  smoke-deploy:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    env:
      TEST_PORT: ${{ vars.TEST_PORT || '9010' }}

    steps:
      - name: Checkout Server repository
        uses: actions/checkout@v4

      - name: Docker preflight
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          docker version
          if ($LASTEXITCODE -ne 0) { throw 'Docker Engine is not available. Start Docker Desktop.' }

          docker compose version
          if ($LASTEXITCODE -ne 0) { throw 'Docker Compose is not available.' }

          $published = docker ps --filter "publish=$env:TEST_PORT" --format "{{.Names}}"
          if ($published -and ($published -notcontains 'server-infra-smoke')) {
            throw "TEST_PORT $env:TEST_PORT is already used by container: $($published -join ', '). Set Repository Variable TEST_PORT to another free port."
          }

          $listener = Get-NetTCPConnection -State Listen -LocalPort ([int]$env:TEST_PORT) -ErrorAction SilentlyContinue
          if ($listener -and -not $published) {
            throw "TEST_PORT $env:TEST_PORT is already used by a host process. Set Repository Variable TEST_PORT to another free port."
          }

      - name: Start smoke frontend
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          docker compose up -d --build --remove-orphans
          if ($LASTEXITCODE -ne 0) { throw 'docker compose up failed.' }

      - name: Verify health endpoint
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "http://127.0.0.1:$env:TEST_PORT/health"
          $healthy = $false

          for ($attempt = 1; $attempt -le 30; $attempt++) {
            try {
              $response = Invoke-WebRequest -UseBasicParsing -Uri $url -TimeoutSec 3
              if ($response.StatusCode -eq 200 -and $response.Content.Trim() -eq 'ok') {
                $healthy = $true
                break
              }
            } catch {
              Start-Sleep -Seconds 2
            }
          }

          if (-not $healthy) {
            throw "Smoke frontend health check failed: $url"
          }

          Write-Host "Smoke frontend is healthy: $url"

      - name: Show access addresses
        shell: powershell
        run: |
          Write-Host "Local : http://127.0.0.1:$env:TEST_PORT"
          Write-Host "Health: http://127.0.0.1:$env:TEST_PORT/health"

          $ips = Get-NetIPAddress -AddressFamily IPv4 -ErrorAction SilentlyContinue |
            Where-Object {
              $_.IPAddress -notlike '127.*' -and
              $_.IPAddress -notlike '169.254*' -and
              $_.InterfaceAlias -notmatch 'vEthernet|Loopback|Docker|WSL'
            } |
            Select-Object -ExpandProperty IPAddress -Unique

          foreach ($ip in $ips) {
            Write-Host "LAN   : http://${ip}:$env:TEST_PORT"
          }

          docker compose ps

      - name: Record verified smoke status
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path deploy/status | Out-Null
          @"
          verified_sha=${{ github.sha }}
          test_port=$env:TEST_PORT
          health=http://127.0.0.1:$env:TEST_PORT/health
          "@ | Set-Content -Path deploy/status/smoke.txt -Encoding ascii

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/status/smoke.txt

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Smoke status already matches.'
            exit 0
          }

          git commit -m "chore: record verified infrastructure smoke ${{ github.sha }}"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to commit smoke verification marker.' }

          git pull --rebase origin main
          if ($LASTEXITCODE -ne 0) { throw 'Failed to rebase smoke verification marker.' }

          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Failed to push smoke verification marker.' }

      - name: Diagnostics on failure
        if: failure()
        shell: powershell
        run: |
          Write-Host '=== docker ps -a ==='
          docker ps -a
          Write-Host '=== compose ps ==='
          docker compose ps
          Write-Host '=== compose logs ==='
          docker compose logs --tail 200
