name: sync-connector-secrets

# Writes hub's connector/AI secrets directly into the mini PC's runtime .env over SSH, flips
# HUB_AI_MODE to gemini once a real key lands (deploy-hub.ps1 only ever forces it back to mock as a
# safety net, never forward), and recreates hub-ai/hub-backend so the change is actually live - not
# just written to a file nobody restarted to pick up. Lives here rather than on the hub repo itself:
# this repo already owns SERVER_SSH_KEY (the deploy pipeline needs it too) and already holds its
# own copies of hub's connector secrets, so no repo needs a second copy of the SSH key just to run
# this. Manual trigger only: these values change rarely, and firing an SSH session into production
# on every routine push would be wasteful and unrelated to what that push actually changed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_PORT: ${{ secrets.SERVER_PORT }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
      VAL_GITHUB_CLIENT_ID: ${{ secrets.HUB_CLIENT_ID }}
      VAL_GITHUB_CLIENT_SECRET: ${{ secrets.HUB_CLIENT_SECRET }}
      VAL_GITHUB_TOKEN: ${{ secrets.HUB_TOKEN }}
      VAL_SLACK_CLIENT_ID: ${{ secrets.SLACK_CLIENT_ID }}
      VAL_SLACK_CLIENT_SECRET: ${{ secrets.SLACK_CLIENT_SECRET }}
      VAL_SLACK_TEAM_ID: ${{ secrets.SLACK_TEAM_ID }}
      VAL_SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
      VAL_NOTION_CLIENT_ID: ${{ secrets.NOTION_CLIENT_ID }}
      VAL_NOTION_CLIENT_SECRET: ${{ secrets.NOTION_CLIENT_SECRET }}
      VAL_NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      VAL_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      VAL_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      VAL_GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      VAL_GOOGLE_ACCESS_TOKEN: ${{ secrets.GOOGLE_ACCESS_TOKEN }}
      VAL_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Write connector secrets into the runtime .env over SSH
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SERVER_HOST" ] || [ -z "$SERVER_USER" ] || { [ -z "$SERVER_SSH_KEY" ] && [ -z "$SERVER_PASSWORD" ]; }; then
            echo 'Server SSH secrets are not configured on this repo (need SERVER_HOST/SERVER_USER and SERVER_SSH_KEY or SERVER_PASSWORD).' >&2
            exit 1
          fi
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          port="${SERVER_PORT:-22}"
          key_args=()
          if [ -n "$SERVER_SSH_KEY" ]; then
            printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/server_deploy_key"
            chmod 600 "$HOME/.ssh/server_deploy_key"
            key_args=(-i "$HOME/.ssh/server_deploy_key")
          fi
          if [ -n "$SERVER_PASSWORD" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
            export SSHPASS="$SERVER_PASSWORD"
            auth=(sshpass -e ssh "${key_args[@]}")
          else
            auth=(ssh "${key_args[@]}")
          fi
          ssh_options=(-o BatchMode=no -o NumberOfPasswordPrompts=1 -o ConnectTimeout=30 -o ServerAliveInterval=10 -o ServerAliveCountMax=60 -o TCPKeepAlive=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)

          # Escapes a value for safe embedding inside a PowerShell single-quoted string (doubles
          # any embedded single quote) - defends the heredoc below against a secret that happens
          # to contain one.
          psq() { printf '%s' "${1//\'/\'\'}"; }

          # deploy-hub.ps1 only ever forces HUB_AI_MODE from gemini down to mock (a safety net for
          # a blank key), never the other way - so a runtime env created before any key existed
          # stays on mock forever even after this workflow fills in a real GEMINI_API_KEY. Flip it
          # forward here whenever we have a key to give it.
          if [ -n "$VAL_GEMINI_API_KEY" ]; then hub_ai_mode='gemini'; else hub_ai_mode=''; fi

          remote_script="$RUNNER_TEMP/server-sync-connector-secrets.ps1"
          cat > "$remote_script" <<PWSH
          \$ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          \$RuntimeEnv = 'D:\server-data\hub\runtime\.env'
          if (-not (Test-Path \$RuntimeEnv)) {
              [Console]::Out.WriteLine("Runtime env not found at \$RuntimeEnv - has hub ever been deployed?")
              [Environment]::Exit(1)
          }
          \$pairs = @{
              'GITHUB_CLIENT_ID' = '$(psq "$VAL_GITHUB_CLIENT_ID")'
              'GITHUB_CLIENT_SECRET' = '$(psq "$VAL_GITHUB_CLIENT_SECRET")'
              'GITHUB_TOKEN' = '$(psq "$VAL_GITHUB_TOKEN")'
              'SLACK_CLIENT_ID' = '$(psq "$VAL_SLACK_CLIENT_ID")'
              'SLACK_CLIENT_SECRET' = '$(psq "$VAL_SLACK_CLIENT_SECRET")'
              'SLACK_TEAM_ID' = '$(psq "$VAL_SLACK_TEAM_ID")'
              'SLACK_TOKEN' = '$(psq "$VAL_SLACK_TOKEN")'
              'NOTION_CLIENT_ID' = '$(psq "$VAL_NOTION_CLIENT_ID")'
              'NOTION_CLIENT_SECRET' = '$(psq "$VAL_NOTION_CLIENT_SECRET")'
              'NOTION_TOKEN' = '$(psq "$VAL_NOTION_TOKEN")'
              'GOOGLE_CLIENT_ID' = '$(psq "$VAL_GOOGLE_CLIENT_ID")'
              'GOOGLE_CLIENT_SECRET' = '$(psq "$VAL_GOOGLE_CLIENT_SECRET")'
              'GOOGLE_REFRESH_TOKEN' = '$(psq "$VAL_GOOGLE_REFRESH_TOKEN")'
              'GOOGLE_ACCESS_TOKEN' = '$(psq "$VAL_GOOGLE_ACCESS_TOKEN")'
              'GEMINI_API_KEY' = '$(psq "$VAL_GEMINI_API_KEY")'
              'HUB_AI_MODE' = '$(psq "$hub_ai_mode")'
          }
          \$lines = @(Get-Content \$RuntimeEnv)
          \$changed = 0
          foreach (\$key in \$pairs.Keys) {
              \$value = \$pairs[\$key]
              if ([string]::IsNullOrWhiteSpace(\$value)) { continue }
              \$prefix = "\$key="
              \$found = \$false
              for (\$i = 0; \$i -lt \$lines.Count; \$i++) {
                  if (\$lines[\$i].StartsWith(\$prefix)) {
                      if (\$lines[\$i] -ne "\$key=\$value") { \$lines[\$i] = "\$key=\$value"; \$changed++ }
                      \$found = \$true
                      break
                  }
              }
              if (-not \$found) { \$lines += "\$key=\$value"; \$changed++ }
          }
          if (\$changed -gt 0) {
              \$lines | Set-Content -Path \$RuntimeEnv -Encoding ascii
              [Console]::Out.WriteLine("Updated \$changed connector setting(s) in \$RuntimeEnv.")
              [Console]::Out.WriteLine('Recreating hub-ai and hub-backend so the change takes effect...')
              \$composeFile = 'C:\home\server\app\deploy\compose\hub.yml'
              docker compose --env-file \$RuntimeEnv -p hub-production -f \$composeFile up -d --force-recreate hub-ai hub-backend
              if (\$LASTEXITCODE -ne 0) {
                  [Console]::Out.WriteLine("docker compose up failed with exit code \$LASTEXITCODE")
                  [Environment]::Exit(1)
              }
              [Console]::Out.WriteLine('hub-ai and hub-backend recreated.')
          } else {
              [Console]::Out.WriteLine('No changes - runtime env already matches.')
          }
          PWSH

          wrapper='$writer = New-Object System.IO.StreamWriter([Console]::OpenStandardOutput()); $writer.AutoFlush = $true; [Console]::SetOut($writer); $script = [Console]::In.ReadToEnd(); Invoke-Expression $script'
          encoded_wrapper="$(printf '%s' "$wrapper" | iconv -f UTF-8 -t UTF-16LE | base64 -w0)"
          remote_command="powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand $encoded_wrapper"
          timeout 5m "${auth[@]}" -p "$port" "${ssh_options[@]}" "$SERVER_USER@$SERVER_HOST" "$remote_command" < "$remote_script"
