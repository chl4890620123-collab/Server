name: diagnose-service-data

# Read-only SSH diagnostic: for each of aitm/maple/restok, lists any docker images still tagged
# for that service, and the size of its D:\server-data directories (runtime data, backups,
# deployed source checkouts). Nothing here stops, removes, or modifies anything - it exists to
# answer "what exactly is here and how big is it" before any decommission decision.
# Manual trigger only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_PORT: ${{ secrets.SERVER_PORT }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
    steps:
      - name: Read-only image/data-size diagnostics over SSH
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SERVER_HOST" ] || [ -z "$SERVER_USER" ] || { [ -z "$SERVER_SSH_KEY" ] && [ -z "$SERVER_PASSWORD" ]; }; then
            echo 'Server SSH secrets are not configured in the Server repository.' >&2
            exit 1
          fi
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          port="${SERVER_PORT:-22}"
          key_args=()
          if [ -n "$SERVER_SSH_KEY" ]; then
            printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/server_deploy_key"
            chmod 600 "$HOME/.ssh/server_deploy_key"
            key_args=(-i "$HOME/.ssh/server_deploy_key")
          fi
          if [ -n "$SERVER_PASSWORD" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
            export SSHPASS="$SERVER_PASSWORD"
            auth=(sshpass -e ssh "${key_args[@]}")
          else
            auth=(ssh "${key_args[@]}")
          fi
          ssh_options=(-o BatchMode=no -o NumberOfPasswordPrompts=1 -o ConnectTimeout=30 -o ServerAliveInterval=10 -o ServerAliveCountMax=60 -o TCPKeepAlive=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)

          remote_script="$RUNNER_TEMP/diagnose-service-data.ps1"
          cat > "$remote_script" <<'PWSH'
          $ErrorActionPreference = 'Continue'

          [Console]::Out.WriteLine('=== docker images matching aitm/maple/restok ===')
          docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}\t{{.ID}}" 2>&1 |
            Select-String -Pattern 'aitm|maple|restok' -CaseSensitive:$false | Write-Output

          [Console]::Out.WriteLine('=== docker networks matching aitm/maple/restok ===')
          docker network ls --format "{{.Name}}" 2>&1 | Select-String -Pattern 'aitm|maple|restok' | Write-Output

          foreach ($dir in @('D:\server-data\aitm','D:\server-data\maple','D:\server-data\restok','D:\server-data\sources\aitm','D:\server-data\sources\maple','D:\server-data\sources\restok')) {
            [Console]::Out.WriteLine("=== $dir ===")
            if (Test-Path $dir) {
              $sizeBytes = (Get-ChildItem $dir -Recurse -Force -ErrorAction SilentlyContinue | Measure-Object -Property Length -Sum).Sum
              $sizeGB = [math]::Round((($sizeBytes ?? 0) / 1GB), 2)
              [Console]::Out.WriteLine("size: ${sizeGB} GB")
              Get-ChildItem $dir -ErrorAction SilentlyContinue | Select-Object Name,LastWriteTime | Format-Table -AutoSize | Out-String -Width 200 | Write-Output
            } else {
              [Console]::Out.WriteLine('does not exist')
            }
          }
          PWSH

          wrapper='$writer = New-Object System.IO.StreamWriter([Console]::OpenStandardOutput()); $writer.AutoFlush = $true; [Console]::SetOut($writer); $script = [Console]::In.ReadToEnd(); Invoke-Expression $script'
          encoded_wrapper="$(printf '%s' "$wrapper" | iconv -f UTF-8 -t UTF-16LE | base64 -w0)"
          remote_command="powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand $encoded_wrapper"
          timeout 3m "${auth[@]}" -p "$port" "${ssh_options[@]}" "$SERVER_USER@$SERVER_HOST" "$remote_command" < "$remote_script"
