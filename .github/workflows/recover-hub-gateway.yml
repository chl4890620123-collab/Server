name: Recover Hub gateway forwarding

# Restart only the existing Hub gateway if backend health is good but host forwarding fails.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-hub-gateway.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_PORT: ${{ secrets.SERVER_PORT }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
    steps:
      - name: Recover existing Hub gateway and verify HTTP
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SERVER_HOST" ] || [ -z "$SERVER_USER" ] || { [ -z "$SERVER_SSH_KEY" ] && [ -z "$SERVER_PASSWORD" ]; }; then
            echo 'Server SSH secrets are not configured in the Server repository.' >&2
            exit 1
          fi
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          port="${SERVER_PORT:-22}"
          key_args=()
          if [ -n "$SERVER_SSH_KEY" ]; then
            printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/server_deploy_key"
            chmod 600 "$HOME/.ssh/server_deploy_key"
            key_args=(-i "$HOME/.ssh/server_deploy_key")
          fi
          if [ -n "$SERVER_PASSWORD" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
            export SSHPASS="$SERVER_PASSWORD"
            auth=(sshpass -e ssh "${key_args[@]}")
          else
            auth=(ssh "${key_args[@]}")
          fi
          ssh_options=(-o BatchMode=no -o NumberOfPasswordPrompts=1 -o ConnectTimeout=30 -o ServerAliveInterval=10 -o ServerAliveCountMax=60 -o TCPKeepAlive=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)

          remote_script="$RUNNER_TEMP/diagnose-logs.ps1"
          cat > "$remote_script" <<'PWSH'
          $ErrorActionPreference = 'Stop'
          function Fail([string]$message) { [Console]::Out.WriteLine($message); [Environment]::Exit(1) }
          $health = docker inspect --format '{{.State.Health.Status}}' hub-backend
          if ($LASTEXITCODE -ne 0 -or $health.Trim() -ne 'healthy') { Fail 'Backend is not healthy; gateway recovery aborted.' }
          $inside = docker exec hub-backend curl --silent --max-time 8 --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/actuator/health
          if ($LASTEXITCODE -ne 0 -or $inside -ne '200') { Fail 'Backend HTTP probe failed; gateway recovery aborted.' }
          $before = curl.exe --silent --max-time 8 --output NUL --write-out '%{http_code}' http://127.0.0.1:9070/actuator/health
          [Console]::Out.WriteLine("Host HTTP before recovery: $before")
          if ($before -ne '200') {
              docker restart hub-caddy
              if ($LASTEXITCODE -ne 0) { Fail 'Hub gateway restart failed.' }
          }
          $local = ''
          for ($i = 0; $i -lt 12; $i++) {
              $local = curl.exe --silent --max-time 8 --output NUL --write-out '%{http_code}' http://127.0.0.1:9070/actuator/health
              if ($local -eq '200') { break }
              Start-Sleep -Seconds 3
          }
          [Console]::Out.WriteLine("Host HTTP after recovery: $local")
          if ($local -ne '200') { Fail 'Gateway restart did not restore host forwarding.' }
          foreach ($url in @('https://yellow.it.kr/', 'https://yellow.it.kr/actuator/health')) {
              $status = curl.exe --silent --show-error --max-time 15 --output NUL --write-out '%{http_code}' $url
              [Console]::Out.WriteLine("$url HTTP=$status")
              if ($LASTEXITCODE -ne 0 -or $status -ne '200') { Fail 'Public HTTP verification failed.' }
          }
          [Console]::Out.WriteLine('Hub gateway recovered; backend and database were not restarted.')
          PWSH

          wrapper='$writer = New-Object System.IO.StreamWriter([Console]::OpenStandardOutput()); $writer.AutoFlush = $true; [Console]::SetOut($writer); $script = [Console]::In.ReadToEnd(); Invoke-Expression $script'
          encoded_wrapper="$(printf '%s' "$wrapper" | iconv -f UTF-8 -t UTF-16LE | base64 -w0)"
          remote_command="powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand $encoded_wrapper"
          timeout 6m "${auth[@]}" -p "$port" "${ssh_options[@]}" "$SERVER_USER@$SERVER_HOST" "$remote_command" < "$remote_script"

      - name: Verify public Hub from external runner
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 https://yellow.it.kr/ >/dev/null
          curl --fail --silent --show-error --max-time 20 https://yellow.it.kr/actuator/health
