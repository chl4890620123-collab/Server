name: Validate Server operations

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "deploy/compose/**"
      - "deploy/caddy/**"
      - "deploy/runtime/**"
      - "deploy/scripts/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "deploy/compose/**"
      - "deploy/caddy/**"
      - "deploy/runtime/**"
      - "deploy/scripts/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Enforce Server-owned deployment boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f deploy/scripts/deploy-service.ps1
          grep -q "ValidateSet('hub')" deploy/scripts/deploy-service.ps1
          grep -Fq "C:\\home\\server\\sources" deploy/scripts/deploy-service.ps1
          grep -q 'chl4890620123-collab/hub.git' deploy/scripts/deploy-service.ps1

      - name: Validate PowerShell deployment scripts parse
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'deploy/scripts/deploy-service.ps1',
            'deploy/scripts/deploy-hub.ps1',
            'deploy/scripts/ensure-public-route.ps1'
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Required operations script is missing: $file" }
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell syntax validation failed: $file"
            }
            Write-Host "PowerShell syntax OK: $file"
          }

      - name: Validate Hub production Compose
        shell: bash
        env:
          DB_NAME: hub
          DB_USER: hub
          DB_PASSWORD: ci-hub-password
          HUB_DB_DATA_DIR: /tmp/hub-db
          HUB_STORAGE_DATA_DIR: /tmp/hub-storage
          HUB_CADDYFILE: /tmp/hub.Caddyfile
          HUB_HOST_PORT: "9070"
          HUB_JWT_SECRET: ci-hub-jwt-secret-that-is-at-least-32-bytes-long
        run: docker compose -p hub-validation -f deploy/compose/hub.yml config >/dev/null

      - name: Validate Caddy configurations
        shell: bash
        run: |
          set -euo pipefail
          for service in hub; do
            docker run --rm -v "$PWD/deploy/caddy/${service}.Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile
          done
