services:
  smoke-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: server-infra-smoke
    restart: unless-stopped
    ports:
      - "${TEST_PORT:-9010}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 3s
